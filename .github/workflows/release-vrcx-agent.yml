name: Release VRCX.Agent (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.10.7)'
        required: true
        default: 'v1.10.7'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run VRCX.Agent unit tests
        run: dotnet test VRCX-Agent.Tests/VRCX-Agent.Tests.csproj -c Release

      - name: Determine version & tag
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v', 'V')
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = '1.10.7' }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish VRCX.Agent (Setup installer + standalone + portable)
        id: publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.ver }}"
          $stage = Join-Path $env:RUNNER_TEMP "vrcx-agent-release"
          New-Item -ItemType Directory -Force -Path "$stage\standalone", "$stage\portable", "$stage\installer" | Out-Null

          dotnet publish VRCX-Agent/VRCX-Agent.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$ver `
            -o "$stage\standalone"

          Copy-Item "images\VRCX.ico" "$stage\standalone\VRCX.ico" -Force

          dotnet publish VRCX-Agent/VRCX-Agent.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$ver `
            -o "$stage\portable"

          # Locate or install/upgrade Inno Setup 6 compiler (ISCC.exe)
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc -or -not (Test-Path $iscc)) {
            throw "Could not locate Inno Setup 6 ISCC.exe"
          }

          # Prepare Simplified Chinese language file matching installed Inno Setup version
          $innoDir = Split-Path -Parent $iscc
          $localCnIsl = Join-Path $innoDir "Languages\ChineseSimplified.isl"
          if (-not (Test-Path $localCnIsl)) {
            choco upgrade innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            $innoDir = Split-Path -Parent $iscc
            $localCnIsl = Join-Path $innoDir "Languages\ChineseSimplified.isl"
          }
          Write-Host "Using Inno Setup compiler: $iscc"

          $cnIslPath = Join-Path $stage "ChineseSimplified.isl"
          if (Test-Path $localCnIsl) {
            Copy-Item $localCnIsl $cnIslPath -Force
          } else {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" `
              -OutFile $cnIslPath `
              -UseBasicParsing
          }
          if (-not (Test-Path $cnIslPath) -or (Get-Item $cnIslPath).Length -lt 1024) {
            throw "Failed to obtain valid ChineseSimplified.isl for Inno Setup"
          }
          # Ensure UTF-8 BOM on .isl so Inno Setup parses Chinese cleanly on English Windows runners
          $islBytes = [System.IO.File]::ReadAllBytes($cnIslPath)
          if ($islBytes.Length -lt 3 -or $islBytes[0] -ne 0xEF -or $islBytes[1] -ne 0xBB -or $islBytes[2] -ne 0xBF) {
            $islText = [System.Text.Encoding]::UTF8.GetString($islBytes)
            $utf8Bom = New-Object System.Text.UTF8Encoding($true)
            [System.IO.File]::WriteAllText($cnIslPath, $islText, $utf8Bom)
          }

          $setupBase = "VRCX.Agent-$tag-Setup-win-x64"
          $issPath = (Resolve-Path "VRCX-Agent\Installer\VRCX-Agent.iss").Path
          $iconPath = (Resolve-Path "images\VRCX.ico").Path

          # Ensure UTF-8 BOM on .iss so Inno Setup parses Chinese [CustomMessages] cleanly on English runners
          $issBytes = [System.IO.File]::ReadAllBytes($issPath)
          if ($issBytes.Length -lt 3 -or $issBytes[0] -ne 0xEF -or $issBytes[1] -ne 0xBB -or $issBytes[2] -ne 0xBF) {
            $issText = [System.Text.Encoding]::UTF8.GetString($issBytes)
            $utf8Bom = New-Object System.Text.UTF8Encoding($true)
            [System.IO.File]::WriteAllText($issPath, $issText, $utf8Bom)
          }

          & $iscc `
            "/DAppVersion=$ver" `
            "/DSourceDir=$stage\standalone" `
            "/DOutputDir=$stage\installer" `
            "/DOutputBaseFilename=$setupBase" `
            "/DIconPath=$iconPath" `
            "/DChineseIslPath=$cnIslPath" `
            $issPath
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          $setupExe = Join-Path "$stage\installer" "$setupBase.exe"
          if (-not (Test-Path $setupExe)) {
            throw "Installer output not found: $setupExe"
          }

          $standaloneZip = Join-Path $stage "VRCX.Agent-$tag-win-x64-standalone.zip"
          $portableZip = Join-Path $stage "VRCX.Agent-$tag-win-x64-portable.zip"
          Compress-Archive -Path "$stage\standalone\*" -DestinationPath $standaloneZip -Force
          Compress-Archive -Path "$stage\portable\*" -DestinationPath $portableZip -Force

          $shaSetup = (Get-FileHash $setupExe -Algorithm SHA256).Hash.ToLower()
          $shaStandalone = (Get-FileHash $standaloneZip -Algorithm SHA256).Hash.ToLower()
          $shaPortable = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLower()

          $bt = [char]96
          $notesLines = @(
            "## VRCX.Agent $tag (Windows 桌面伴侣安装版 / Companion for VRCX-Worker)",
            "",
            "轻量级 Windows 系统托盘伴侣程序（零 CEF、零 Electron），支持简体中文 / English 自动跟随系统语言，后台静默运行与开机自启动。",
            "",
            "### 下载 / Downloads",
            "- **${bt}VRCX.Agent-$tag-Setup-win-x64.exe${bt}（推荐标准安装版 / Recommended Installer）**：双击安装，内置 .NET 10 运行时，无需管理员权限，默认勾选**开机自动后台启动**并驻留系统托盘，支持一键覆盖升级与系统应用列表卸载。",
            "- **${bt}VRCX.Agent-$tag-win-x64-standalone.zip${bt}（免安装独立绿色版 / Standalone ZIP）**：内置 .NET 10 运行时，解压后直接双击 ${bt}VRCX.Agent.exe${bt} 运行。",
            "- **${bt}VRCX.Agent-$tag-win-x64-portable.zip${bt}（轻量版 / Lightweight ZIP）**：体积约 1.5 MB，需电脑已安装 [.NET 10 Windows Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0)。",
            "",
            "### 主要功能 / Key Features",
            "- 全界面简体中文 / English 自动适配（中文系统默认全中文界面与托盘菜单）",
            "- **内置在线自动更新与旧安装包自动清理**：检测到新版本自动下载、SHA-256 校验并静默覆盖重启升级，升级启动后自动清理残留安装包；手动检查更新在已是最新版本或异常时弹出明确提示框",
            "- 后台系统托盘运行与开机自启动（单击托盘图标打开设置界面，双击打开云端网页）",
            "- 定时 HTTPS 同步（${bt}POST /api/agent/sync${bt}），设备名称与同步间隔（默认 60 秒）均由网页端统一控制",
            "- 海外直连 / 中国大陆代理一键切换（支持系统代理、HTTP/HTTPS/SOCKS4/SOCKS5，以及**原生直连 ${bt}vmess://${bt} 节点链接，支持 TCP / TCP+HTTP 伪装 / TLS / WS / WSS**）",
            "- VRChat 本地日志增量采集、照片同步开关与可选 WebP 压缩（默认关闭）、Discord RPC 与允许列表远程指令",
            "",
            "### 快速开始 / Quick Setup",
            "1. 打开你的 VRCX-Worker 网页端 → 点击底部 **云端** 打开 **云端中心 → Windows 伴侣 (HTTP 同步)**，复制 **云端连接地址** 并创建 **同步密钥**。",
            "2. 下载并运行 ${bt}VRCX.Agent-$tag-Setup-win-x64.exe${bt} 完成安装（默认勾选开机后台自启动）。",
            "3. 首次启动会自动打开设置窗口，粘贴云端地址与同步密钥，选择海外直连或中国大陆代理，点击 **测试连接并保存** 后即自动最小化到右下角系统托盘后台运行。",
            "",
            "### SHA-256 Checksums",
            "- ${bt}VRCX.Agent-$tag-Setup-win-x64.exe${bt}: ${bt}$shaSetup${bt}",
            "- ${bt}VRCX.Agent-$tag-win-x64-standalone.zip${bt}: ${bt}$shaStandalone${bt}",
            "- ${bt}VRCX.Agent-$tag-win-x64-portable.zip${bt}: ${bt}$shaPortable${bt}"
          )
          $notesLines -join "`n" | Set-Content -Path "$stage\notes.md" -Encoding UTF8

          echo "stage=$stage" >> $env:GITHUB_OUTPUT
          echo "setup_exe=$setupExe" >> $env:GITHUB_OUTPUT
          echo "standalone_zip=$standaloneZip" >> $env:GITHUB_OUTPUT
          echo "portable_zip=$portableZip" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          $stage = "${{ steps.publish.outputs.stage }}"
          $setupExe = "${{ steps.publish.outputs.setup_exe }}"
          $standaloneZip = "${{ steps.publish.outputs.standalone_zip }}"
          $portableZip = "${{ steps.publish.outputs.portable_zip }}"
          $notes = "$stage\notes.md"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setupExe $standaloneZip $portableZip --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
            gh release edit $tag --title "VRCX.Agent $tag (Windows x64)" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
          } else {
            gh release create $tag $setupExe $standaloneZip $portableZip `
              --title "VRCX.Agent $tag (Windows x64)" `
              --notes-file $notes `
              --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
