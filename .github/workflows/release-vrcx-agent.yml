name: Release VRCX.Agent (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run VRCX.Agent unit tests
        run: dotnet test Dotnet/VRCX-Agent.Tests/VRCX-Agent.Tests.csproj -c Release

      - name: Determine version & tag
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = '1.1.0' }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish VRCX.Agent (standalone + portable)
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.ver }}"
          $stage = Join-Path $env:RUNNER_TEMP "vrcx-agent-release"
          New-Item -ItemType Directory -Force -Path "$stage\standalone", "$stage\portable" | Out-Null

          dotnet publish Dotnet/VRCX-Agent/VRCX-Agent.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$ver `
            -o "$stage\standalone"

          Copy-Item "images\VRCX.ico" "$stage\standalone\VRCX.ico" -Force

          dotnet publish Dotnet/VRCX-Agent/VRCX-Agent.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$ver `
            -o "$stage\portable"

          $standaloneZip = Join-Path $stage "VRCX.Agent-$tag-win-x64-standalone.zip"
          $portableZip = Join-Path $stage "VRCX.Agent-$tag-win-x64-portable.zip"
          Compress-Archive -Path "$stage\standalone\*" -DestinationPath $standaloneZip -Force
          Compress-Archive -Path "$stage\portable\*" -DestinationPath $portableZip -Force

          $shaStandalone = (Get-FileHash $standaloneZip -Algorithm SHA256).Hash.ToLower()
          $shaPortable = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLower()

          $bt = [char]96
          $notesLines = @(
            "## VRCX.Agent $tag (Windows Companion for VRCX-Worker)",
            "",
            "Lightweight Windows system-tray companion for [VRCX-Worker](https://github.com/nuomew/VRCX-Worker) (zero CEF, zero Electron).",
            "",
            "### Downloads",
            "- **${bt}VRCX.Agent-$tag-win-x64-standalone.zip${bt} (Recommended / 推荐独立免装版)**: Self-contained single-file Windows x64 build with .NET 10 Desktop Runtime bundled. Extract and double-click ${bt}VRCX.Agent.exe${bt} directly.",
            "- **${bt}VRCX.Agent-$tag-win-x64-portable.zip${bt} (Lightweight / 轻量版)**: Framework-dependent build (~1.5 MB). Requires [.NET 10 Windows Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0).",
            "",
            "### Key Features",
            "- Periodic HTTPS API sync (${bt}POST /api/agent/sync${bt}) strictly controlled by Web **Cloud Sync Interval** (default 60s; buffers locally outside the scheduled window)",
            "- Overseas (Direct / Proxy Off) vs Mainland China (Proxy On: Windows system proxy or HTTP/HTTPS/SOCKS4/SOCKS5) quick toggle in tray menu & settings",
            "- Incremental VRChat ${bt}output_log_*.txt${bt} tailing, PNG metadata embedding + <=1600px WebP thumbnail upload to Cloudflare R2 (${bt}R2_MEDIA${bt}), Discord RPC, VR notifications, and allowlisted remote commands",
            "",
            "### Quick Setup",
            "1. Open your VRCX-Worker web app -> **Cloud Hub** -> **Win Agent (HTTP Sync)** -> copy **Cloud URL** and create a **Sync Secret**.",
            "2. Extract the zip and launch ${bt}VRCX.Agent.exe${bt}.",
            "3. Right-click the tray icon -> **Sync Settings (URL, Secret & Proxy)...**, paste Cloud URL & Sync Secret, select Overseas or Mainland China mode, and click **Test & Save**.",
            "",
            "### SHA-256 Checksums",
            "- ${bt}VRCX.Agent-$tag-win-x64-standalone.zip${bt}: ${bt}$shaStandalone${bt}",
            "- ${bt}VRCX.Agent-$tag-win-x64-portable.zip${bt}: ${bt}$shaPortable${bt}"
          )
          $notesLines -join "`n" | Set-Content -Path "$stage\notes.md" -Encoding UTF8

          echo "stage=$stage" >> $env:GITHUB_OUTPUT
          echo "standalone_zip=$standaloneZip" >> $env:GITHUB_OUTPUT
          echo "portable_zip=$portableZip" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $stage = "${{ steps.meta.outputs.stage }}"
          $standaloneZip = "${{ steps.meta.outputs.standalone_zip }}"
          $portableZip = "${{ steps.meta.outputs.portable_zip }}"
          $notes = "$stage\notes.md"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $standaloneZip $portableZip --clobber
            gh release edit $tag --title "VRCX.Agent $tag (Windows x64)" --notes-file $notes
          } else {
            gh release create $tag $standaloneZip $portableZip `
              --title "VRCX.Agent $tag (Windows x64)" `
              --notes-file $notes `
              --target "${{ github.sha }}"
          }
